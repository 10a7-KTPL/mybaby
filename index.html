<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Bé cưới tui nhé? 💖</title>

<style>
/* RESET để mobile không bị lệch */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  background: linear-gradient(135deg,#ffb6c1,#fff0f5);
  font-family: "Segoe UI", cursive;
  color: #e91e63;
  text-align: center;
  overflow-x: hidden;
}

/* ======== MÀN HÌNH 1 ======== */
.screen1 {
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center; 
  align-items: center;
  gap: 20px;          /* FIX lệch */
  padding-top: 40px;
  padding-bottom: 40px;
}

/* ẢNH TRÒN */
#slideshow {
  width: 240px;
  height: 240px;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(255,182,193,0.8);
  position: relative;
}

#slideshow img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  opacity: 0;
  transition: opacity 1.2s;
}

#slideshow img.active {
  opacity: 1;
}

h1 {
  font-size: 1.9em;
  text-shadow: 0 0 8px white;
}

/* BUTTON WRAPPER – FIX NÚT BỊ ĐÈ */
.button-wrap {
  width: 220px;
  height: 55px;
  position: relative;
  display: flex;
  justify-content: center;
}

/* NÚT */
button {
  background-color: #ff69b4;
  border: none;
  color: white;
  padding: 12px 28px;
  font-size: 1.2em;
  border-radius: 25px;
  box-shadow: 0 0 10px #ffb6c1;
  position: absolute;
  z-index: 5; /* FIX đè */
}

#yesBtn {
  left: 0;
  z-index: 10; /* ưu tiên */
}

#noBtn {
  right: 0;
  z-index: 9;
}

/* TIM BAY */
.heart{
  position:fixed;
  bottom:0;
  font-size:22px;
  animation:floatUp 5s linear infinite;
  color:#ff69b4;
}

@keyframes floatUp{
  0%{ transform:translateY(0) scale(1); opacity:1; }
  100%{ transform:translateY(-100vh) scale(1.8); opacity:0; }
}

/* ======== MÀN HÌNH 2 ======== */
#surpriseScreen {
  display: none;
  background: linear-gradient(135deg,#ffe0eb,#fff0f7);
  padding: 40px 0;
  min-height: 100vh;
}

/* GALLERY */
#gallery {
  width: 300px;
  height: 300px;
  border-radius: 20px;
  margin: 0 auto 20px auto;
  overflow: hidden;
  position: relative;
  box-shadow: 0 0 15px #ffb6c1;
}

#gallery img {
  width:100%;
  height:100%;
  object-fit:contain;
  position:absolute;
  opacity:0;
  transition:opacity 1.2s;
}

#gallery img.active {
  opacity:1;
}

/* HỘP NHẮN GỬI */
#wishBox {
  background: white;
  padding: 15px;
  border-radius: 15px;
  width: 85%;
  max-width: 500px;
  box-shadow: 0 0 15px #ffc0d3;
  white-space: pre-wrap;
  margin: auto;
  color: #e91e63;
}
</style>
</head>

<body>

<!-- =================== MÀN HÌNH 1 =================== -->
<div class="screen1">

  <div id="slideshow">
    <img src="09b3634f-3528-4b7f-8b14-4c8b75df9d11.jpg" class="active">
    <img src="20d10877-7b41-4d70-9921-a34baf6fa3b3.jpg">
    <img src="655d7fa6-2662-47e4-a809-2ce6c2cef756.jpg">
    <img src="9b62cd67-6494-4b1e-861e-afea79281ad6.jpg">
  </div>

  <h1>Bé cưới tui nhé? 💖</h1>

  <div class="button-wrap">
    <button id="yesBtn">Dạ 💍</button>
    <button id="noBtn">hog 😅</button>
  </div>

</div>

<!-- =================== MÀN HÌNH 2 =================== -->
<div id="surpriseScreen">

  <div id="gallery">
    <img src="a773b4b9-e012-465b-876d-8b850ae62647.jpg" class="active">
    <img src="bc45c61b-20d4-4ca4-87c6-c24a9a17293d.jpg">
    <img src="e5212d85-668f-4fb6-bf64-df931b159fb1.jpg">
    <img src="fd333211-a712-4d36-8911-8b67417667f9.jpg">
  </div>

  <div id="wishBox">
Vậy là đã gần 6 tháng mình quen nhau rùi ha ❤️  
Thời gian qua biết bao nhiêu là kỷ niệm đẹp  
vui cũng có mà cãi nhau cũng khum ít 😭  

Nhưng mà…  
tui lúc nào cũng thương Thư nhiều lắmmm 💖  

Bé Thư đã đồng ý cưới tui rùi  
và tui hứa sau này sẽ làm Thư hạnh phúc nhất ✨💍  
  </div>

</div>

<script>
/* SLIDESHOW MÀN 1 */
const slides = document.querySelectorAll('#slideshow img');
let idx = 0;
setInterval(()=>{
  slides[idx].classList.remove('active');
  idx = (idx + 1) % slides.length;
  slides[idx].classList.add('active');
}, 3500);

/* SLIDESHOW MÀN 2 */
const gal = document.querySelectorAll('#gallery img');
let g = 0;
setInterval(()=>{
  gal[g].classList.remove('active');
  g = (g+1)%gal.length;
  gal[g].classList.add('active');
}, 4000);

/* TIM BAY */
function createHeart(){
  const h=document.createElement('div');
  h.className='heart';
  h.textContent='💖';
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(Math.random()*20+15)+'px';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),5000);
}
setInterval(createHeart,300);

/* NÚT HOG NHẢY */
const no = document.getElementById('noBtn');
function moveNo(){
  const x=Math.random()*(window.innerWidth-120);
  const y=Math.random()*(window.innerHeight-70);
  no.style.left=x+'px';
  no.style.top=y+'px';
}
no.addEventListener('mouseover', moveNo);
no.addEventListener('touchstart', moveNo);

/* NÚT "DẠ" CHUYỂN MÀN */
document.getElementById('yesBtn').onclick = () => {
  document.querySelector('.screen1').style.display='none';
  document.getElementById('surpriseScreen').style.display='block';
};
</script>

</body>
</html>
